<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- maximum-scale=1 … 入力欄をタップしたときなどに、画面が自動で拡大されたままにならないように -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>フック王</title>
<!-- ホーム画面のアイコン・名前 -->
<link rel="apple-touch-icon" href="./assets/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="フック王">
<link rel="icon" href="data:,">
<!-- 画面の文字と景品パネルの商品名のフォント（M PLUS Rounded 1c）。vendor/ に同梱（電波がなくても使える）。読めないときは普通のフォントで表示 -->
<link rel="stylesheet" href="./vendor/fonts/m-plus-rounded-1c/500.css">
<link rel="stylesheet" href="./vendor/fonts/m-plus-rounded-1c/800.css">
<style>
  /* ---- 配色：紫×ピンクのかわいい系 ---- */
  :root {
    --bg: #2a1745;
    --panel: #3a1f5f;
    --line: #6a46a8;
    --text: #ffffff;
    --sub: #e4d4ff;
    --accent: #ff4f9a;
    --pink: #ff6fae;
    --gold: #ffd34d;
    --ok: #4be3a8;
    /* iPhone の切り欠き・角の安全な範囲 */
    --sat: env(safe-area-inset-top, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  /* touch-action: manipulation … 連続タップ（ダブルタップ）で画面が拡大されないように */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "M PLUS Rounded 1c", -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-weight: 800;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }

  /* ---- 3D表示と、その上の表示 ---- */
  /* 筐体の画面は全機種で横4：縦5に固定（カメラと枠の見え方を同じにするため）。
     縦の残りはボタン側へ。画面が短い機種では筐体の画面を縮めて、左右を黒塗りにする */
  #stage { position: relative; flex: 0 1 125vw; min-height: 0; background: #000; }
  #view { height: 100%; aspect-ratio: 4 / 5; width: auto; max-width: 100%; margin: 0 auto; display: block; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* 下の帯：右から左へ文字を流し続ける（押しても下の画面に届くように、帯自体は押せない） */
  #ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; overflow: hidden; pointer-events: none;
    background: linear-gradient(90deg, #ff3f8ecc, #ff7ab8cc, #ff3f8ecc); border-top: 2px solid #ffd1e8; }
  #ticker[hidden] { display: none; }
  /* 文字の左に帯の幅ぶんの余白を付け、横にずらすだけで流す（位置を計算し直さないので、iPhoneでも1周の切れ目でちらつかない） */
  #ticker span { display: inline-block; padding-left: 100%; white-space: nowrap; line-height: 24px;
    font-size: 14px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px #0006;
    will-change: transform; animation: ticker 9s linear infinite; }
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  #status { position: absolute; left: 0; right: 0; top: 0;
    padding: calc(8px + var(--sat)) calc(12px + var(--sar)) 12px calc(12px + var(--sal));
    font-size: 14px; color: #fff; text-shadow: 0 1px 3px #3a1460;
    background: linear-gradient(#2a1745e6, transparent); pointer-events: none; }
  #stageLabel { position: absolute; left: calc(10px + var(--sal)); top: calc(36px + var(--sat));
    padding: 4px 34px 4px 14px; border-radius: 999px;
    font-size: 15px; font-weight: 800; letter-spacing: 0.04em; color: var(--gold);
    background: linear-gradient(#5b2c8f, #2f1655); border: 2px solid var(--gold);
    box-shadow: 0 0 8px #ffd34d99, inset 0 1px 0 #ffffff44; pointer-events: none; }
  #stageLabel::after { content: '★'; position: absolute; right: 9px; top: 50%; transform: translateY(-52%);
    font-size: 20px; color: var(--gold); text-shadow: 0 0 6px #ffd34d; }
  #btnDebug { position: absolute; right: calc(10px + var(--sar)); top: calc(34px + var(--sat));
    border-radius: 999px; padding: 6px 14px; }
  #hud { position: absolute; left: calc(10px + var(--sal)); top: calc(72px + var(--sat));
    display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--sub); pointer-events: none; }
  #hud span { background: linear-gradient(#4a2780ee, #2f1655ee); border: 1.5px solid #8a63d2; border-radius: 999px;
    padding: 2px 10px; align-self: flex-start; box-shadow: 0 1px 4px #0006; }
  #hud b { color: #fff; font-size: 14px; }
  #hud .hud-r { font-size: 11px; opacity: 0.85; margin-left: 2px; }

  /* ---- 結果 ---- */
  #result { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 14px;
    background: linear-gradient(#4a2780f2, #2f1655f2); border: 2px solid #ff9fd0; border-radius: 18px;
    box-shadow: 0 0 16px #ff6fae66; }
  .res-title { font-size: 28px; font-weight: 800; margin-bottom: 6px; text-shadow: 0 2px 0 #0004; }
  .res-title.win { color: var(--gold); }
  .res-title.lose { color: var(--pink); }
  .res-row { font-size: 13px; color: var(--sub); margin: 3px 0; font-weight: 500; }
  #result .big { margin-top: 10px; width: 100%; }
  .res-prize { display: flex; gap: 10px; align-items: center; margin: 4px 0 8px; padding: 8px; border-radius: 12px; background: #ffffff1a; font-size: 14px; }
  .res-new { color: var(--gold); font-weight: 800; }
  .stars { color: var(--gold); letter-spacing: -1px; }
  .stars .off { color: #8a76a8; }
  .res-btns { display: flex; gap: 8px; margin-top: 10px; }
  .res-btns .big { flex: 2; }
  .res-btns #btnSkip { flex: 1; font-size: 13px; white-space: nowrap; padding: 10px 8px; }

  /* ---- 操作パネル ---- */
  /* 操作パネルは小さめにして、筐体の表示を広く取る（画面の高さが低い機種ではさらに小さく） */
  #controls { position: relative; flex: 1 0 auto; padding: 8px calc(10px + var(--sar)) calc(16px + env(safe-area-inset-bottom)) calc(10px + var(--sal));
    background: linear-gradient(#3d1f66, #2a1745); border-top: 3px solid #ff9fd0;
    box-shadow: 0 -4px 14px #ff6fae55; overflow: hidden; }
  /* 下の雲と星の飾り */
  #controls::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 16px; pointer-events: none;
    background:
      radial-gradient(circle at 8% 130%, #ffc6e4 0 14px, transparent 15px),
      radial-gradient(circle at 24% 150%, #ffb3da 0 17px, transparent 18px),
      radial-gradient(circle at 42% 140%, #ffc6e4 0 15px, transparent 16px),
      radial-gradient(circle at 60% 155%, #ffb3da 0 18px, transparent 19px),
      radial-gradient(circle at 78% 135%, #ffc6e4 0 15px, transparent 16px),
      radial-gradient(circle at 95% 150%, #ffb3da 0 17px, transparent 18px);
    opacity: 0.9; }
  #controls::before { content: '★　　　　✦　　　　★　　　　✦　　　　★'; position: absolute; left: 0; right: 0; bottom: 1px;
    text-align: center; font-size: 9px; color: #ffe27a; text-shadow: 0 0 6px #ffd34d; pointer-events: none; z-index: 1;
    white-space: nowrap; overflow: hidden; }

  button { font: inherit; font-size: 14px; font-weight: 800; padding: 7px 8px; border-radius: 999px; white-space: nowrap;
    border: 2px solid #8a63d2; color: #fff;
    background: linear-gradient(#6a3fb0, #4a2780); box-shadow: inset 0 2px 0 #ffffff33, 0 3px 0 #23103f; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; }
  button.big { font-size: 17px; padding: 12px; color: #fff; border: 2px solid #ffd1e8;
    background: linear-gradient(#ff7ab8, #ff3f8e); box-shadow: inset 0 2px 0 #ffffff66, 0 3px 0 #a3185a, 0 0 10px #ff6fae88; }

  .views { display: flex; gap: 6px; margin-bottom: 8px; }
  .views button { padding: 6px 8px; font-size: 14px; }
  .views button { flex: 1; }
  .views button.active { background: linear-gradient(#ff7ab8, #ff3f8e); border-color: var(--gold);
    box-shadow: inset 0 2px 0 #ffffff66, 0 3px 0 #a3185a, 0 0 10px #ffd34d99; }
  
  .views button:disabled { opacity: 0.45; }

  .main { display: flex; gap: 10px; }
  .hold { position: relative; flex: 1; height: clamp(50px, 7.6vh, 64px); font-size: clamp(26px, 4.2vh, 34px); border-radius: 20px; touch-action: none;
    color: #e9dcff; border: 2px solid #9a74e0;
    background: linear-gradient(#6a3fb0, #42226f); box-shadow: inset 0 3px 0 #ffffff33, 0 5px 0 #1f0e38; }
  .hold:not(:disabled) { color: #fff; border-color: #ffd1e8;
    background: linear-gradient(#ff8cc2, #ff3f8e); box-shadow: inset 0 3px 0 #ffffff66, 0 5px 0 #a3185a, 0 0 14px #ff6fae99; }
  #btnX:not(:disabled)::before, #btnX:not(:disabled)::after { position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 18px; color: var(--gold); text-shadow: 0 0 6px #ffd34d; }
  #btnX:not(:disabled)::before { content: '◀◀'; left: 16%; letter-spacing: -6px; }
  #btnX:not(:disabled)::after { content: '▶▶'; right: 16%; letter-spacing: -6px; }
  /* ②：奥へ動くので上向きの矢印（▲を縦に2つ）を左右に */
  #btnZ:not(:disabled)::before, #btnZ:not(:disabled)::after { content: '▲\A▲'; white-space: pre; line-height: 0.62;
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 18px; color: var(--gold); text-shadow: 0 0 6px #ffd34d; }
  #btnZ:not(:disabled)::before { left: 16%; }
  #btnZ:not(:disabled)::after { right: 16%; }
  .hold.on { transform: translateY(3px); box-shadow: inset 0 3px 0 #ffffff55, 0 2px 0 #a3185a, 0 0 18px #ffd34d; }
  .hold:disabled { opacity: 0.6; }

  .row3 { display: flex; gap: 6px; margin-top: 28px; }   /* ①②を押しながら下のボタンを押し間違えないよう、間を空ける */
  .row3 button { flex: 1; }
  .sounds { display: flex; gap: 6px; margin-top: 6px; }
  .sounds button { flex: 1; font-size: 13px; padding: 5px 6px; }
  .sounds button.active { color: #fff; }

  /* 画面の高さが低い機種（SE など）では、さらに詰める */
  @media (max-height: 700px) {
    .views { margin-bottom: 6px; }
    .row3 { margin-top: 20px; }
    .sounds { margin-top: 5px; }
    button { font-size: 13px; padding: 5px 6px; }
    .views button { padding: 5px 6px; font-size: 13px; }
    .sounds button { font-size: 12px; padding: 4px 6px; }
  }

  /* ---- モーダル（マイボックス・ステージ・広告） ---- */
  #modal { position: fixed; inset: 0; z-index: 20; background: #1a0b2fb3; display: flex; align-items: center; justify-content: center; padding: 12px; }
  #modal[hidden] { display: none; }
  #btnDebug[hidden], .dbg-row[hidden] { display: none; }
  .m-card { width: 100%; max-width: 440px; max-height: 92dvh; overflow-y: auto; background: linear-gradient(#4a2780, #2f1655);
    border: 2px solid #ff9fd0; border-radius: 20px; padding: 14px; box-shadow: 0 0 20px #ff6fae66; }
  .m-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 18px; }
  .m-head .m-pt { margin-left: auto; font-size: 13px; color: var(--sub); }
  .m-head .m-pt b { color: var(--gold); font-size: 16px; }
  .m-x { margin-left: auto; font-size: 18px; padding: 2px 12px; }
  .m-pt + .m-x { margin-left: 0; }
  /* 横にだけスクロール（縦にはずれない）。下の余白はボタンの影が切れないため */
  .m-tabs { display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; overscroll-behavior: contain;
    padding-bottom: 5px; margin-bottom: 5px; }
  .m-tabs button { flex: 0 0 auto; font-size: 12px; padding: 6px 10px; border-color: var(--cat); border-radius: 14px; }
  .m-tabs button small { display: block; font-size: 11px; }
  .m-tabs button.on { background: var(--cat); color: #2a1040; }
  .m-cat { border: 2px solid var(--cat); border-radius: 16px; padding: 10px; background: #ffffff10; }
  .m-cat-title { font-weight: 800; margin-bottom: 6px; }
  .m-done { color: var(--gold); }
  .m-bar { height: 8px; border-radius: 4px; background: #ffffff22; overflow: hidden; margin-bottom: 10px; }
  .m-bar i { display: block; height: 100%; background: var(--cat); }
  .m-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .m-cell { position: relative; aspect-ratio: 3 / 4; border-radius: 14px; background: #ffffff14; border: 1.5px solid #8a63d2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; text-align: center; }
  .m-cell.got { background: linear-gradient(#ffffff, var(--cat)); border: 2px solid #fff; }
  .m-cell.got .m-name { color: #3a1460; font-weight: 800; }
  .m-star { position: absolute; top: 3px; font-size: 12px; }
  .m-pic { height: 64px; display: flex; align-items: center; }
  .m-name { font-size: 11px; color: var(--sub); line-height: 1.25; font-weight: 700; }
  .m-num { position: absolute; right: 6px; bottom: 3px; font-size: 11px; color: #3a1460; font-weight: 800; }
  .m-note { font-size: 11px; color: var(--sub); margin-top: 8px; line-height: 1.5; font-weight: 500; }
  .m-sum { font-size: 13px; color: var(--sub); margin-bottom: 10px; line-height: 1.6; font-weight: 500; }
  .m-front { width: 100%; margin-bottom: 12px; }
  .m-sub { font-size: 13px; margin-bottom: 6px; }
  .m-stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .m-stages button { font-size: 13px; }
  .m-stages button.on { border-color: var(--gold); }
  .m-empty { color: var(--sub); font-size: 13px; }
  .m-ad { height: 220px; border-radius: 16px; background: #ffffff14; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; color: var(--sub); }
  .m-ad-t { font-size: 40px; font-weight: 800; color: #fff; }
  .m-ad .big { width: 60%; }
  /* マイボックスの「景品」「アイテム」切り替え */
  .m-mode { display: flex; gap: 6px; margin-bottom: 10px; }
  .m-mode button { flex: 1; font-size: 15px; padding: 8px; position: relative; }
  .m-mode button.on { background: linear-gradient(#ff8cc2, #ff3f8e); border-color: #ffd1e8; }
  .m-mode i { position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--gold);
    color: #5a2a00; font-size: 12px; font-style: normal; line-height: 20px; }
  /* マイボックスのボタンのバッジ（開けていないカードパックの数） */
  #btnBox { position: relative; }
  #btnBox[data-badge]::after { content: attr(data-badge); position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px;
    padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: var(--gold); color: #5a2a00; font-size: 12px;
    font-weight: 800; line-height: 20px; text-align: center; }
  body.theme-cool #btnBox[data-badge]::after { color: #0b1220; background: #5fd0ff; }
  .m-msg { background: #ffffff1c; border-radius: 12px; padding: 8px 10px; margin-bottom: 10px; font-size: 13px; color: var(--gold); font-weight: 700; }
  /* カードパック（アイテムタブ） */
  .m-pack { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; background: #ffffff14; margin-bottom: 10px; }
  .m-pack-pic, .pk-pack { background: linear-gradient(135deg, #ffd166, #ff6fae 55%, #8a63d2); color: #fff; font-weight: 800;
    text-align: center; border: 2px solid #fff; text-shadow: 0 1px 2px #0006; }
  .m-pack-pic { width: 46px; height: auto; background: none; border: none; filter: drop-shadow(0 2px 6px #0006); }
  .m-pack-txt { flex: 1; font-size: 14px; }
  .m-pack-txt small { display: block; font-size: 11px; color: var(--sub); font-weight: 500; }
  .m-pack .big { padding: 8px 14px; font-size: 15px; }
  .m-effects { font-size: 12px; background: #ffffff10; border-radius: 12px; padding: 8px 10px; margin-bottom: 10px; line-height: 1.7; }
  /* アイテムの一覧（アイテムタブ・交換所） */
  .m-items { display: flex; flex-direction: column; gap: 6px; }
  .m-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: #ffffff14; }
  .m-item.none { opacity: 0.55; }
  .m-item-ic { width: 40px; height: 40px; flex: 0 0 auto; }
  .it-img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 2px 3px #0005); }
  .it-img.it-s, .it-img.it-hud { display: inline-block; vertical-align: -3px; filter: none; }
  .it-img.it-s { width: 16px; height: 16px; }
  .it-img.it-hud { width: 14px; height: 14px; }
  .m-item-txt { flex: 1; font-size: 14px; }
  .m-item-txt span { font-size: 12px; color: var(--gold); margin-left: 4px; }
  .m-item-txt small { display: block; font-size: 11px; color: var(--sub); font-weight: 500; line-height: 1.4; }
  .m-item button { flex: 0 0 auto; font-size: 13px; padding: 8px 10px; min-width: 64px; }
  .m-head .m-round { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #ffffff22; color: var(--gold); }
  .m-rounds { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 10px; }
  .m-rounds button { padding: 14px; font-size: 17px; }
  .m-cats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .m-cats button { border-color: var(--cat); padding: 12px; font-size: 15px; }
  /* カードパックを開ける */
  .pk-stage { min-height: 200px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .pk-pack { width: 130px; padding: 0; border: none; background: none; box-shadow: none; animation: pk-wiggle 1.2s ease-in-out infinite; }
  .pk-pack img { width: 100%; display: block; filter: drop-shadow(0 0 18px #ffd16699); }
  .pk-pack small { display: block; font-size: 12px; margin-top: 8px; color: #fff; }
  .pk-pack.open { animation: pk-burst 0.35s ease-in forwards; }
  @keyframes pk-wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes pk-burst { to { transform: scale(1.3); opacity: 0; } }
  .pk-cards { display: flex; gap: 10px; }
  .pk-cards[hidden] { display: none; }
  .pk-card { position: relative; width: 100px; height: 146px; padding: 0; border: none; background: none; box-shadow: none; perspective: 600px; }
  .pk-card span { position: absolute; inset: 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    backface-visibility: hidden; transition: transform 0.45s; border: 2px solid #fff; }
  /* カードの絵：裏・表の台紙は画像。表にはアイコンを上の窓に、名前を下の帯にのせる */
  .pk-card span { border: none; }
  .pk-back { background: url(./assets/items/card_back.webp) center / 100% 100% no-repeat; }
  .pk-front { background: url(./assets/items/card_front.webp) center / 100% 100% no-repeat; color: #6b3500; transform: rotateY(180deg); }
  .pk-front .pk-ic { position: absolute; left: 22%; top: 20%; width: 56%; height: 40%; }
  .pk-front b { position: absolute; left: 12%; right: 12%; top: 70%; height: 16%; display: flex; align-items: center; justify-content: center;
    font-size: 11px; line-height: 1.2; white-space: normal; text-align: center; }
  .pk-card.flip .pk-back { transform: rotateY(180deg); }
  .pk-card.flip .pk-front { transform: rotateY(360deg); }
  .pk-ok { width: 100%; }
  #hud .hud-e { font-size: 12px; }
  /* ---- トップ画面 ----
     縦長の絵を横幅いっぱいに、上にそろえて置く（ロゴが切れないように左右は切らない）。
     画面のほうが縦長なら、下の余りはじゅうたんに近い色。START は画面の下のほう */
  #title { position: fixed; inset: 0; z-index: 50; overflow: hidden; background: linear-gradient(#4a0b13, #1a0508);
    transition: opacity 0.5s ease; }
  #title.out { opacity: 0; pointer-events: none; }
  .tt-img { position: absolute; left: 0; top: 0; width: 100%; height: auto; max-height: 100%; object-fit: cover; object-position: 50% 30%; display: block;
    -webkit-mask-image: linear-gradient(#000 92%, transparent); mask-image: linear-gradient(#000 92%, transparent); }
  /* START：タイトルロゴに合わせた金と赤 */
  #btnStart { position: absolute; left: 50%; bottom: calc(3vh + env(safe-area-inset-bottom)); transform: translateX(-50%); width: auto; padding: 10px 30px; white-space: nowrap; border-radius: 999px;
    font-size: 22px; font-weight: 800; letter-spacing: 0.18em; text-indent: 0.18em; color: #7a1206;
    background: linear-gradient(#fff6c2 0%, #ffd34d 45%, #f2a516 55%, #ffcf4a 100%);
    border: 3px solid #fff3b8; box-shadow: 0 0 0 4px #b3121c, 0 8px 0 4px #6e0a10, 0 0 30px #ffd34d88;
    text-shadow: 0 1px 0 #fff8; animation: start-glow 1.8s ease-in-out infinite; }
  #btnStart:active { transform: translate(-50%, 4px); box-shadow: 0 0 0 4px #b3121c, 0 4px 0 4px #6e0a10, 0 0 30px #ffd34d88; }
  @keyframes start-glow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.15) drop-shadow(0 0 14px #ffd34daa); } }
  /* ---- お祝いの演出（コンプリート） ---- */
  .cel { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; overflow: hidden;
    opacity: 0; transition: opacity 0.35s ease; }
  .cel.in { opacity: 1; }
  .cel.out { opacity: 0; }
  .cel-bg { position: absolute; inset: 0; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    background: radial-gradient(120% 80% at 50% 38%, #6a2fa8d9 0%, #2a1145f0 55%, #12061ff7 100%); }
  .cel-cool .cel-bg { background: radial-gradient(120% 80% at 50% 38%, #0f3a6bd9 0%, #07121ff0 55%, #020509f7 100%); }
  /* 後ろでゆっくり回る光の筋 */
  .cel-rays { position: absolute; left: 50%; top: 36%; width: 180vmax; height: 180vmax; margin: -90vmax 0 0 -90vmax;
    background: repeating-conic-gradient(from 0deg, #ffffff16 0deg 7deg, transparent 7deg 22deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, #0008 22%, transparent 48%); mask-image: radial-gradient(circle, #000 0%, #0008 22%, transparent 48%);
    animation: cel-spin 40s linear infinite; opacity: 0; transition: opacity 1.2s ease 0.2s; }
  .cel.in .cel-rays { opacity: 1; }
  .cel-cat .cel-rays { opacity: 0 !important; }
  @keyframes cel-spin { to { transform: rotate(360deg); } }
  .cel-fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  .cel-body { position: relative; z-index: 1; width: min(88vw, 380px); text-align: center; color: #fff; }
  .cel-label { font-size: 13px; letter-spacing: 0.32em; font-weight: 800; color: #ffe9a8; opacity: 0;
    animation: cel-up 0.6s ease 0.15s forwards; }
  .cel-cool .cel-label { color: #9fe3ff; }
  /* タイトル：金色のグラデーションの文字。弾むように出て、光が横切る */
  .cel-title { font-size: 54px; line-height: 1.05; font-weight: 800; letter-spacing: 0.04em; margin: 6px 0 4px;
    background: linear-gradient(100deg, #fff3c4 0%, #ffd34d 30%, #fffbe8 46%, #ffd34d 54%, #ff9fd0 100%);
    background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #7a2a5a) drop-shadow(0 0 18px #ffd34d66);
    transform: scale(0.4); opacity: 0;
    animation: cel-pop 0.7s cubic-bezier(.2, 1.5, .4, 1) 0.3s forwards, cel-shine 2.6s ease-in-out 1.1s infinite; }
  .cel-cat .cel-title { font-size: 44px; }
  .cel-cool .cel-title { background-image: linear-gradient(100deg, #ffffff 0%, #9fe3ff 30%, #ffffff 46%, #9fe3ff 54%, #3aa0ff 100%);
    filter: drop-shadow(0 3px 0 #0b2a55) drop-shadow(0 0 18px #5fd0ff66); }
  @keyframes cel-pop { to { transform: scale(1); opacity: 1; } }
  @keyframes cel-shine { 0% { background-position: 100% 0; } 60%, 100% { background-position: 0% 0; } }
  .cel-sub { font-size: 20px; font-weight: 800; margin-bottom: 18px; opacity: 0; animation: cel-up 0.6s ease 0.6s forwards;
    text-shadow: 0 2px 8px #0006; }
  .cel-rewards { display: flex; flex-direction: column; gap: 10px; }
  .cel-reward { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 18px;
    background: linear-gradient(#ffffff1f, #ffffff0d); border: 1px solid #ffffff40;
    box-shadow: 0 8px 24px #0004, inset 0 1px 0 #ffffff33; opacity: 0; animation: cel-up 0.6s ease var(--d) forwards; }
  .cel-ic { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-size: 26px; background: linear-gradient(135deg, #ffd166, #ff6fae); box-shadow: 0 0 16px #ffd16666; }
  .cel-cool .cel-ic { background: linear-gradient(135deg, #5fd0ff, #2f6bff); box-shadow: 0 0 16px #5fd0ff66; }
  .cel-ic .cel-pack { height: 44px; width: auto; filter: drop-shadow(0 2px 4px #0006); }
  .cel-rt b { display: block; font-size: 16px; }
  .cel-rt small { display: block; font-size: 12px; opacity: 0.85; line-height: 1.5; margin-top: 2px; font-weight: 500; }
  .cel-note { font-size: 12px; opacity: 0; margin-top: 14px; animation: cel-up 0.6s ease var(--d) forwards; color: #ffffffcc; }
  .cel-ok { width: 100%; margin-top: 18px; opacity: 0; animation: cel-up 0.6s ease var(--d) forwards; }
  @keyframes cel-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  /* 特訓ボタン：開放されてまだ押していないとき */
  #btnDebug.is-new { animation: btn-glow 1.6s ease-in-out infinite; }
  #btnDebug.is-new::after { content: 'NEW'; position: absolute; top: -8px; right: -6px; font-size: 10px; font-weight: 800;
    padding: 2px 6px; border-radius: 999px; background: var(--gold); color: #5a2a00; box-shadow: 0 0 8px #ffd34d; }
  @keyframes btn-glow { 0%, 100% { box-shadow: 0 0 6px #ffd34d66; } 50% { box-shadow: 0 0 18px #ffd34d, 0 0 32px #ff6fae88; } }
  body.theme-cool #btnDebug.is-new::after { background: #5fd0ff; color: #0b1220; box-shadow: 0 0 8px #5fd0ff; }
  body.theme-cool #btnDebug.is-new { animation-name: btn-glow-cool; }
  @keyframes btn-glow-cool { 0%, 100% { box-shadow: 0 0 6px #5fd0ff66; } 50% { box-shadow: 0 0 18px #5fd0ff, 0 0 32px #2f7bff88; } }

  /* ---- 数値調整パネル（開発用） ---- */
  #debug { flex: 1 1 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #1e1036;
    padding: 12px calc(14px + var(--sar)) calc(30px + env(safe-area-inset-bottom)) calc(14px + var(--sal)); font-weight: 500;
    border-top: 2px solid #ff8cc2; }
  #debug[hidden] { display: none; }
  body.dbg-open #controls { display: none; }
  .dbg-head { margin-bottom: 8px; }
  .dbg-sub { display: block; font-size: 12px; color: var(--sub); }
  .dbg-group { margin: 18px 0 6px; font-weight: 800; color: var(--pink); }
  .dbg-row { padding: 6px 0; border-bottom: 1px solid #3a2560; }
  .dbg-row.changed .dbg-label { color: var(--gold); }
  .dbg-label { font-size: 13px; margin-bottom: 4px; }
  .dbg-value { color: var(--sub); }
  .dbg-row input[type=range] { width: 100%; }
  /* 初期設定の目印と、戻すボタン */
  .dbg-slider { position: relative; padding-top: 8px; }
  .dbg-mark { position: absolute; top: -2px; transform: translateX(-50%); font-size: 10px; line-height: 1; color: var(--gold);
    pointer-events: none; }
  .dbg-mark::before { content: '▼'; }
  .dbg-back { margin-left: 8px; padding: 0 8px; font-size: 13px; line-height: 20px; border-radius: 999px; }
  .dbg-back[hidden] { display: none; }
  /* 選択欄は16px以上（iPhone の Safari は16px未満の入力欄をタップすると画面を自動で拡大してしまう） */
  .dbg-row select { width: 100%; padding: 6px; font-size: 16px; background: #2f1655; color: #fff; border: 1px solid #8a63d2; border-radius: 8px; }
  .dbg-check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .dbg-info { font-size: 13px; color: var(--gold); background: #2f1655; border-radius: 8px; padding: 8px 10px; margin: 8px 0; line-height: 1.6; }
  .dbg-return { width: 100%; margin: 6px 0 10px; font-size: 16px; }
  .dbg-return[hidden] { display: none; }
  .dbg-reset-all { width: 100%; margin: 10px 0 4px; font-size: 13px; }
  .dbg-title { display: flex; align-items: center; gap: 8px; }
  .dbg-buttons { display: flex; gap: 6px; margin-left: auto; }
  .dbg-buttons button { font-size: 12px; padding: 4px 12px; }

  /* ---- テーマの切り替え（右上、「調整」の左） ---- */
  #themeToggle { position: absolute; right: calc(98px + var(--sar)); top: calc(36px + var(--sat)); display: flex;
    padding: 2px; border-radius: 999px; background: #2f1655cc; border: 1.5px solid #8a63d2; }
  #themeToggle button { font-size: 11px; padding: 4px 8px; border: none; box-shadow: none; background: transparent; color: #cdb8f2; }
  #themeToggle button.on { background: linear-gradient(#ff7ab8, #ff3f8e); color: #fff; box-shadow: 0 0 6px #ff6fae99; }

  /* =========================================================
     クール：黒とメタリックのグレーに、青いネオンの光
     （キュートの指定を上書きする）
     ========================================================= */
  body.theme-cool {
    --bg: #05070c; --panel: #10141c; --line: #3a4352; --text: #ffffff; --sub: #b8c4d6;
    --accent: #2fb8ff; --pink: #5fd0ff; --gold: #e9eef5;
  }
  body.theme-cool #status { text-shadow: 0 1px 3px #000; background: linear-gradient(#05070ce6, transparent); }
  body.theme-cool #stageLabel { color: transparent; background-clip: padding-box;
    background-image: linear-gradient(#2a303c, #0d1017); border: 2px solid #5fd0ff; border-radius: 10px;
    padding: 4px 30px 4px 14px; box-shadow: 0 0 10px #2fb8ff99, inset 0 1px 0 #ffffff33; }
  body.theme-cool #stageLabel { color: #e9eef5; text-shadow: 0 0 1px #fff, 0 1px 0 #7d8796, 0 0 8px #5fd0ff88; }
  body.theme-cool #stageLabel::after { content: '❯'; font-size: 22px; color: #5fd0ff; text-shadow: 0 0 8px #2fb8ff; right: 8px; }
  body.theme-cool #hud span { background: linear-gradient(#262c37ee, #0f131aee); border-color: #5b6578; }
  body.theme-cool #result { background: linear-gradient(#1a202bf2, #0b0e15f2); border-color: #5fd0ff; box-shadow: 0 0 16px #2fb8ff66; }
  body.theme-cool .res-title.win { color: #5fd0ff; text-shadow: 0 0 10px #2fb8ff; }
  body.theme-cool .res-title.lose { color: #c9d3e2; }
  body.theme-cool .res-new { color: #5fd0ff; }
  body.theme-cool .stars { color: #5fd0ff; }

  body.theme-cool #controls { background: linear-gradient(#141923, #05070c); border-top: 2px solid #5fd0ff;
    box-shadow: 0 -4px 16px #2fb8ff66; }
  body.theme-cool #controls::after { height: 14px; opacity: 1;
    background:
      linear-gradient(to top right, transparent 49%, #2fb8ff 50%, transparent 53%) left bottom / 50% 100% no-repeat,
      linear-gradient(to top left, transparent 49%, #2fb8ff 50%, transparent 53%) right bottom / 50% 100% no-repeat;
    filter: drop-shadow(0 0 4px #2fb8ff); }
  body.theme-cool #controls::before { content: none; }

  body.theme-cool button { border-color: #4a5466; color: #e9eef5;
    background: linear-gradient(#323a48, #161b24); box-shadow: inset 0 1px 0 #ffffff33, 0 3px 0 #000; }
  body.theme-cool button.big { border-color: #9fe3ff; background: linear-gradient(#2f9cff, #0a4fc0);
    box-shadow: inset 0 2px 0 #ffffff55, 0 3px 0 #06275f, 0 0 12px #2fb8ff99; }
  body.theme-cool .views button.active { background: linear-gradient(#1f3f6e, #0d1a33); border-color: #5fd0ff;
    box-shadow: inset 0 1px 0 #ffffff33, 0 0 12px #2fb8ffaa; }
  body.theme-cool #ticker { background: linear-gradient(90deg, #0d2a5acc, #1f5fb0cc, #0d2a5acc); border-top-color: #5fd0ff; }
  body.theme-cool #ticker span { color: #e6f6ff; text-shadow: 0 0 6px #2fb8ff; }
  body.theme-cool .hold { color: #8e99ab; border-color: #4a5466; background: linear-gradient(#2a313d, #12161e); box-shadow: inset 0 2px 0 #ffffff22, 0 5px 0 #000; }
  body.theme-cool .hold:not(:disabled) { color: #fff; border-color: #9fe3ff;
    background: linear-gradient(#2f9cff, #0a4fc0); box-shadow: inset 0 3px 0 #ffffff55, 0 5px 0 #06275f, 0 0 16px #2fb8ffaa; }
  body.theme-cool #btnX:not(:disabled)::before, body.theme-cool #btnX:not(:disabled)::after,
  body.theme-cool #btnZ:not(:disabled)::before, body.theme-cool #btnZ:not(:disabled)::after { color: #bff0ff; text-shadow: 0 0 6px #5fd0ff; }
  body.theme-cool .hold.on { box-shadow: inset 0 3px 0 #ffffff55, 0 2px 0 #06275f, 0 0 22px #5fd0ff; }

  body.theme-cool #themeToggle { background: #10141ccc; border-color: #5b6578; }
  body.theme-cool #themeToggle button { color: #9aa6b8; background: transparent; box-shadow: none; }
  body.theme-cool #themeToggle button.on { background: linear-gradient(#2f9cff, #0a4fc0); color: #fff; box-shadow: 0 0 6px #2fb8ff; }

  body.theme-cool #modal { background: #000a; }
  body.theme-cool .m-card { background: linear-gradient(#1a202b, #0b0e15); border-color: #5fd0ff; box-shadow: 0 0 20px #2fb8ff55; }
  body.theme-cool .m-cell { background: #ffffff0d; border-color: #3a4352; }
  body.theme-cool .m-cat { background: #ffffff08; }
  body.theme-cool .m-tabs button.on { color: #0b1220; }
  body.theme-cool .m-cell.got .m-name, body.theme-cool .m-num { color: #fff; }
  body.theme-cool .m-mode button.on { background: linear-gradient(#2f9cff, #0a4fc0); border-color: #9fe3ff; }
  body.theme-cool .m-mode i { color: #0b1220; background: #5fd0ff; }
  body.theme-cool .m-msg, body.theme-cool .m-item-txt span { color: #5fd0ff; }
  body.theme-cool #debug { background: #05070c; border-top-color: #5fd0ff; }
  body.theme-cool .dbg-row select { background: #161b24; border-color: #4a5466; }
  body.theme-cool .dbg-info { background: #161b24; }
  body.theme-cool .dbg-row { border-bottom-color: #1e2430; }
</style>
</head>
<body class="theme-cute">
<!-- トップ画面：タイトルの絵と START。押すとゲーム画面へ -->
<div id="title">
  <img class="tt-img" src="./assets/title.webp" alt="フック王">
  <button id="btnStart">START</button>
</div>
<div id="app">
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="status"></div>
    <div id="stageLabel"></div>
    <div id="themeToggle"><button data-theme="cute">キュート</button><button data-theme="cool">クール</button></div>
    <button id="btnDebug">⚙ 特訓</button>
    <div id="hud"></div>
    <div id="result" hidden></div>
    <!-- 筐体の画面のいちばん下の帯：文字を流す（①を押す前だけ表示） -->
    <div id="ticker"><span>※※　画面タップ(長押し)でフックを確認出来ます　※※</span></div>
  </div>
  <div id="controls">
    <div class="views">
      <button data-cam="normal" class="active">ノーマル</button>
      <button data-cam="front">正面ズーム</button>
      <button data-cam="zoom">斜めズーム</button>
    </div>
    <div class="main">
      <button id="btnX" class="hold">①</button>
      <button id="btnZ" class="hold" disabled>②</button>
    </div>
    <div class="row3">
      <button id="btnRetry">最初から</button>
      <button id="btnStages">ステージ</button>
      <button id="btnBox">マイボックス</button>
    </div>
    <div class="sounds">
      <button id="btnShop">交換所</button>
      <button id="btnBgm">♪ BGM</button>
      <button id="btnSfx">効果音</button>
    </div>
  </div>
  <!-- 特訓の設定：開いている間は、下半分（ボタンの場所）に出してスクロールする。上の筐体でその場で確認 -->
  <div id="debug" hidden></div>
</div>
<div id="modal" hidden></div>
<script>
  // iPhone の Safari は user-scalable=no を無視するので、ダブルタップとピンチでの拡大を止める
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  // 前に拡大された状態が残っていたら、1倍に戻す（表示の設定を一度書き換えると Safari が拡大を解除する）
  function resetZoom() {
    const vv = window.visualViewport;
    if (vv && vv.scale <= 1.01) return;
    const m = document.querySelector('meta[name=viewport]');
    const c = m.getAttribute('content');
    m.setAttribute('content', c.replace('maximum-scale=1', 'maximum-scale=1.0001'));
    setTimeout(() => m.setAttribute('content', c), 60);
  }
  window.addEventListener('load', resetZoom);
  window.addEventListener('orientationchange', () => setTimeout(resetZoom, 300));
  document.addEventListener('focusout', () => setTimeout(resetZoom, 100));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => setTimeout(resetZoom, 200));
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
