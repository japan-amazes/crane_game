<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>フック台 練習（試作）</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0d1016;
    --panel: #171b24;
    --line: #2a3140;
    --text: #e8ebf2;
    --sub: #9aa3b5;
    --accent: #ff5577;
    --ok: #3ddc97;
  }
  /* touch-action: manipulation … 連続タップ（ダブルタップ）で画面が拡大されないように */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }

  /* 3D表示 */
  #stage { position: relative; flex: 1; min-height: 0; }
  #view { width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; left: 0; right: 0; top: 0; padding: 10px 12px;
    font-size: 14px; color: var(--sub); background: linear-gradient(#0d1016cc, transparent); pointer-events: none; }
  #btnDebug { position: absolute; right: 10px; top: 36px; }
  #stageLabel { position: absolute; left: 12px; top: 38px; padding: 4px 10px; border-radius: 8px;
    font-size: 15px; font-weight: 800; letter-spacing: 0.06em; color: #ffd166; background: #171b24cc;
    border: 1px solid #ffd16655; pointer-events: none; }

  /* 結果 */
  #result { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 14px;
    background: #171b24f0; border: 1px solid var(--line); border-radius: 12px; }
  .res-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .res-title.win { color: var(--ok); }
  .res-title.lose { color: var(--accent); }
  .res-row { font-size: 14px; color: var(--sub); margin: 3px 0; }
  #result .big { margin-top: 10px; width: 100%; }

  /* 操作 */
  #controls { padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: var(--panel);
    border-top: 1px solid var(--line); }
  .views { display: flex; gap: 6px; margin-bottom: 10px; }
  .views button { flex: 1; }
  .views button.active { border-color: var(--accent); color: var(--text); }
  .views #btnPeek.active { border-color: #ffd166; color: #ffd166; }
  .views button:disabled { opacity: 0.35; }
  .main { display: flex; gap: 12px; }
  .hold { flex: 1; height: 84px; font-size: 34px; font-weight: 700; border-radius: 16px;
    background: #232a38; color: var(--text); border: 2px solid #3a4459; touch-action: none; }
  .hold.on { background: var(--accent); border-color: var(--accent); transform: translateY(2px); }
  .hold:disabled { opacity: 0.35; }
  button { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: #1f2532; color: var(--sub); }
  button.big { font-size: 16px; padding: 12px; background: var(--accent); color: #fff; border: none; font-weight: 700; }
  .row3 { display: flex; gap: 6px; margin-top: 10px; }
  .row3 button { flex: 1; }
  .sounds { display: flex; gap: 6px; margin-top: 8px; }
  .sounds button { flex: 1; font-size: 13px; padding: 6px 8px; }
  .sounds button.active { color: var(--text); }
  #btnTicket.active { border-color: #ffd166; color: #ffd166; }
  button:disabled { opacity: 0.4; }

  /* クレジットなど（画面左上） */
  #hud { position: absolute; left: 12px; top: 74px; display: flex; flex-direction: column; gap: 3px;
    font-size: 12px; color: var(--sub); pointer-events: none; }
  #hud span { background: #171b24cc; border-radius: 6px; padding: 2px 8px; align-self: flex-start; }
  #hud b { color: var(--text); font-size: 14px; }

  /* 結果の景品 */
  .res-prize { display: flex; gap: 10px; align-items: center; margin: 4px 0 8px; padding: 8px; border-radius: 10px; background: #232a38; font-size: 14px; }
  .res-new { color: #ffd166; font-weight: 700; }
  .stars { color: #ffd166; letter-spacing: -1px; }
  .stars .off { color: #555d6e; }
  .res-btns { display: flex; gap: 8px; margin-top: 10px; }
  .res-btns .big { flex: 2; }
  .res-btns #btnSkip { flex: 1; }

  /* モーダル（マイボックス・ステージ・広告） */
  #modal { position: fixed; inset: 0; z-index: 20; background: #0009; display: flex; align-items: center; justify-content: center; padding: 12px; }
  #modal[hidden] { display: none; }
  .m-card { width: 100%; max-width: 440px; max-height: 92dvh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .m-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 17px; }
  .m-head .m-pt { margin-left: auto; font-size: 13px; color: var(--sub); }
  .m-head .m-pt b { color: #ffd166; font-size: 16px; }
  .m-x { margin-left: auto; font-size: 18px; padding: 2px 12px; }
  .m-pt + .m-x { margin-left: 0; }
  .m-tabs { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 10px; }
  .m-tabs button { flex: 0 0 auto; font-size: 12px; padding: 6px 8px; border-color: var(--cat); }
  .m-tabs button small { display: block; font-size: 11px; }
  .m-tabs button.on { background: var(--cat); color: #10131a; font-weight: 700; }
  .m-cat { border: 2px solid var(--cat); border-radius: 12px; padding: 10px; }
  .m-cat-title { font-weight: 700; margin-bottom: 6px; }
  .m-done { color: #ffd166; }
  .m-bar { height: 8px; border-radius: 4px; background: #2a3140; overflow: hidden; margin-bottom: 10px; }
  .m-bar i { display: block; height: 100%; background: var(--cat); }
  .m-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .m-cell { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; background: #232a38; border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; text-align: center; }
  .m-cell.got { background: linear-gradient(#ffffff, var(--cat)); border: 2px solid #fff; }
  .m-cell.got .m-name { color: #1f2533; font-weight: 700; }
  .m-star { position: absolute; top: 3px; font-size: 12px; }
  .m-pic { height: 64px; display: flex; align-items: center; }
  .m-name { font-size: 11px; color: var(--sub); line-height: 1.25; }
  .m-num { position: absolute; right: 5px; bottom: 3px; font-size: 11px; color: #1f2533; font-weight: 700; }
  .m-note { font-size: 11px; color: var(--sub); margin-top: 8px; line-height: 1.5; }
  .m-ex { margin-top: 10px; padding: 10px; border-radius: 10px; background: #232a38; font-size: 14px; line-height: 1.6; }
  .m-ex-btns { display: flex; gap: 8px; margin-top: 8px; }
  .m-ex-btns button { flex: 1; }
  .m-sum { font-size: 13px; color: var(--sub); margin-bottom: 10px; line-height: 1.6; }
  .m-front { width: 100%; margin-bottom: 12px; }
  .m-sub { font-size: 13px; margin-bottom: 6px; }
  .m-stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .m-stages button.on { border-color: var(--accent); color: var(--text); }
  .m-empty { color: var(--sub); font-size: 13px; }
  .m-ad { height: 220px; border-radius: 12px; background: #232a38; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; color: var(--sub); }
  .m-ad-t { font-size: 40px; font-weight: 800; color: var(--text); }
  .m-ad .big { width: 60%; }

  /* 数値調整パネル */
  #debug { position: fixed; inset: 0; overflow-y: auto; background: #0d1016f5; padding: 14px 14px 40px; z-index: 10; }
  .dbg-head { margin-bottom: 8px; }
  .dbg-sub { display: block; font-size: 12px; color: var(--sub); }
  .dbg-group { margin: 18px 0 6px; font-weight: 700; color: var(--accent); }
  .dbg-row { padding: 6px 0; border-bottom: 1px solid #1d2230; }
  .dbg-row.changed .dbg-label { color: #ffd166; }
  .dbg-label { font-size: 13px; margin-bottom: 4px; }
  .dbg-value { color: var(--sub); }
  .dbg-row input[type=range] { width: 100%; }
  .dbg-row select { width: 100%; padding: 6px; background: #1f2532; color: var(--text); border: 1px solid var(--line); border-radius: 8px; }
  .dbg-check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .dbg-info { font-size: 13px; color: #ffd166; background: #1d2230; border-radius: 8px; padding: 8px 10px; margin: 8px 0; line-height: 1.6; }
  .dbg-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="status"></div>
    <div id="stageLabel"></div>
    <button id="btnDebug">⚙ 調整</button>
    <div id="hud"></div>
    <div id="result" hidden></div>
  </div>
  <div id="controls">
    <div class="views">
      <button data-cam="normal" class="active">ノーマル</button>
      <button data-cam="zoom">ズーム</button>
      <button id="btnPeek">確認</button>
    </div>
    <div class="main">
      <button id="btnX" class="hold">①</button>
      <button id="btnZ" class="hold" disabled>②</button>
    </div>
    <div class="row3">
      <button id="btnRetry">最初から</button>
      <button id="btnStages">ステージ</button>
      <button id="btnBox">マイボックス</button>
    </div>
    <div class="sounds">
      <button id="btnTicket">確定チケット</button>
      <button id="btnBgm">♪ BGM</button>
      <button id="btnSfx">効果音</button>
    </div>
  </div>
</div>
<div id="debug" hidden></div>
<div id="modal" hidden></div>
<script>
  // iPhone の Safari は user-scalable=no を無視するので、ダブルタップとピンチでの拡大を止める
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
