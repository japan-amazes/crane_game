<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>フック台 練習（試作）</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0d1016;
    --panel: #171b24;
    --line: #2a3140;
    --text: #e8ebf2;
    --sub: #9aa3b5;
    --accent: #ff5577;
    --ok: #3ddc97;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }

  /* 3D表示 */
  #stage { position: relative; flex: 1; min-height: 0; }
  #view { width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; left: 0; right: 0; top: 0; padding: 10px 12px;
    font-size: 14px; color: var(--sub); background: linear-gradient(#0d1016cc, transparent); pointer-events: none; }
  #btnDebug { position: absolute; right: 10px; top: 36px; }

  /* 結果 */
  #result { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 14px;
    background: #171b24f0; border: 1px solid var(--line); border-radius: 12px; }
  .res-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .res-title.win { color: var(--ok); }
  .res-title.lose { color: var(--accent); }
  .res-row { font-size: 14px; color: var(--sub); margin: 3px 0; }
  #result .big { margin-top: 10px; width: 100%; }

  /* 操作 */
  #controls { padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: var(--panel);
    border-top: 1px solid var(--line); }
  .views { display: flex; gap: 6px; margin-bottom: 10px; }
  .views button { flex: 1; }
  .views button.active { border-color: var(--accent); color: var(--text); }
  .main { display: flex; gap: 12px; }
  .hold { flex: 1; height: 84px; font-size: 34px; font-weight: 700; border-radius: 16px;
    background: #232a38; color: var(--text); border: 2px solid #3a4459; touch-action: none; }
  .hold.on { background: var(--accent); border-color: var(--accent); transform: translateY(2px); }
  .hold:disabled { opacity: 0.35; }
  button { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: #1f2532; color: var(--sub); }
  button.big { font-size: 16px; padding: 12px; background: var(--accent); color: #fff; border: none; font-weight: 700; }
  #btnRetry { margin-top: 10px; width: 100%; }

  /* 数値調整パネル */
  #debug { position: fixed; inset: 0; overflow-y: auto; background: #0d1016f5; padding: 14px 14px 40px; z-index: 10; }
  .dbg-head { margin-bottom: 8px; }
  .dbg-sub { display: block; font-size: 12px; color: var(--sub); }
  .dbg-group { margin: 18px 0 6px; font-weight: 700; color: var(--accent); }
  .dbg-row { padding: 6px 0; border-bottom: 1px solid #1d2230; }
  .dbg-row.changed .dbg-label { color: #ffd166; }
  .dbg-label { font-size: 13px; margin-bottom: 4px; }
  .dbg-value { color: var(--sub); }
  .dbg-row input[type=range] { width: 100%; }
  .dbg-row select { width: 100%; padding: 6px; background: #1f2532; color: var(--text); border: 1px solid var(--line); border-radius: 8px; }
  .dbg-check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .dbg-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="status"></div>
    <button id="btnDebug">⚙ 調整</button>
    <div id="result" hidden></div>
  </div>
  <div id="controls">
    <div class="views">
      <button data-view="front" class="active">正面</button>
      <button data-view="side">横から</button>
      <button data-view="zoom">拡大</button>
    </div>
    <div class="main">
      <button id="btnX" class="hold">①</button>
      <button id="btnZ" class="hold" disabled>②</button>
    </div>
    <button id="btnRetry">最初から</button>
  </div>
</div>
<div id="debug" hidden></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
